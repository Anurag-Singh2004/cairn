name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CAIRN_LOG_INGEST_URL: ${{ vars.CAIRN_LOG_INGEST_URL }}
      CAIRN_LOG_INGEST_TOKEN: ${{ secrets.CAIRN_LOG_INGEST_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: |
          python scripts/stream_action_logs.py --step "Lint Check" -- ruff check src/ tests/
          python scripts/stream_action_logs.py --step "Format Check" -- ruff format --check src/ tests/

      - name: Unit and integration tests
        run: |
          python scripts/stream_action_logs.py --step "Unit & Integration Tests" -- pytest tests/unit/ tests/integration/ -v
